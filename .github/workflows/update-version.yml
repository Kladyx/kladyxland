name: Update version.json

on:
  push:
    paths:
      - 'index.html'

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version and write JSON
        run: |
          VERSION=$(grep -oP "CURRENT_VERSION = '\K[^']+" index.html)
          echo "{\"kladyxland\": \"$VERSION\"}" > version.json

      - name: Commit version.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add version.json
          git diff --staged --quiet || git commit -m "Auto-update version.json to $(grep -oP "CURRENT_VERSION = '\K[^']+" index.html)"
          git push
